<style>
/* Layout: deal-review console. Sticky deal bar, section tabs; Overview pairs the forecast and score drivers (left) with next actions and the power map (right). */
:root {
  --bg: #F1F3F7;
  --surface: #FFFFFF;
  --surface-2: #E8ECF2;
  --surface-3: #F6F8FB;
  --ink: #121D33;
  --ink-2: #44506A;
  --muted: #5F6B84;
  --line: #DCE1E9;
  --line-2: #C2CAD7;
  --accent: #C4501B;
  --accent-hover: #A8421A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBEADF;
  --focus: #2350C2;
  --pos: #1D47A6;
  --pos-soft: #DCE6F8;
  --neutral: #9AA2B0;
  --neg: #D24343;
  --unk: #C3C9D3;
  --st-crit: #CF3A3A;
  --st-warn: #D99A06;
  --st-ok: #5FA463;
  --st-good: #1B8A43;
  --crit-soft: #FBE6E6;
  --warn-soft: #FBF1D8;
  --ok-soft: #E7F3E7;
  --good-soft: #DCF0E2;
  --zone-pb: rgba(29, 71, 166, 0.04);
  --zone-fox: rgba(196, 80, 27, 0.08);
  --shadow: 0 1px 2px rgba(18, 29, 51, 0.06), 0 6px 20px rgba(18, 29, 51, 0.05);
  --pop-shadow: 0 10px 30px rgba(18, 29, 51, 0.16), 0 2px 6px rgba(18, 29, 51, 0.08);
  --font: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 6px;
  --r-lg: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131E; --surface: #161E2D; --surface-2: #222C3E; --surface-3: #1A2333;
    --ink: #E7ECF5; --ink-2: #B0BACD; --muted: #8E9AB0; --line: #283246; --line-2: #3A465E;
    --accent: #F08049; --accent-hover: #F59A6C; --accent-ink: #1B0F08; --accent-soft: #3A2417;
    --focus: #86A8FF;
    --pos: #5B8FEF; --pos-soft: #1F3157; --neutral: #5F697C; --neg: #E35A5A; --unk: #465168;
    --st-crit: #EE6B6B; --st-warn: #F2B636; --st-ok: #7CC883; --st-good: #41C26E;
    --crit-soft: #3A1E22; --warn-soft: #3A3018; --ok-soft: #1E3324; --good-soft: #17331F;
    --zone-pb: rgba(91, 143, 239, 0.06); --zone-fox: rgba(240, 128, 73, 0.10);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
    --pop-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131E; --surface: #161E2D; --surface-2: #222C3E; --surface-3: #1A2333;
  --ink: #E7ECF5; --ink-2: #B0BACD; --muted: #8E9AB0; --line: #283246; --line-2: #3A465E;
  --accent: #F08049; --accent-hover: #F59A6C; --accent-ink: #1B0F08; --accent-soft: #3A2417;
  --focus: #86A8FF;
  --pos: #5B8FEF; --pos-soft: #1F3157; --neutral: #5F697C; --neg: #E35A5A; --unk: #465168;
  --st-crit: #EE6B6B; --st-warn: #F2B636; --st-ok: #7CC883; --st-good: #41C26E;
  --crit-soft: #3A1E22; --warn-soft: #3A3018; --ok-soft: #1E3324; --good-soft: #17331F;
  --zone-pb: rgba(91, 143, 239, 0.06); --zone-fox: rgba(240, 128, 73, 0.10);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 20px rgba(0, 0, 0, 0.25);
  --pop-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar-inner { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 4px 2px; flex: none; }
.brand b { font-weight: 750; font-stretch: 112%; letter-spacing: -0.01em; font-size: 15px; white-space: nowrap; }
.fox { width: 22px; height: 22px; flex: none; }
.fox path { fill: var(--accent); }
.switch { position: relative; min-width: 0; flex: 0 1 auto; }
.switch-btn {
  display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%;
  background: var(--surface-3); border: 1px solid var(--line); border-radius: var(--r);
  padding: 5px 10px; text-align: left;
}
.switch-btn:hover { border-color: var(--line-2); }
.switch-label { display: grid; min-width: 0; line-height: 1.2; }
.switch-label b { font-weight: 650; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switch-label span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.caret { width: 12px; height: 12px; flex: none; color: var(--muted); }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--st-good); flex: none; }
.status[data-tone="busy"] i { background: var(--st-warn); }
.status[data-tone="idle"] i { background: var(--neutral); }
.status[data-tone="crit"] { color: var(--st-crit); }
.status[data-tone="crit"] i { background: var(--st-crit); }
.more { position: relative; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border-radius: var(--r); border: 1px solid transparent; padding: 7px 12px;
  font-weight: 600; font-size: 13px; line-height: 1.2; white-space: nowrap;
  background: var(--accent); color: var(--accent-ink);
}
.btn:hover { background: var(--accent-hover); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-3); border-color: var(--line-2); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn.icon { padding: 7px 9px; }
.btn.danger { color: var(--st-crit); }
.btn.solid-danger { background: var(--st-crit); color: #fff; }
.btn svg { width: 14px; height: 14px; }
.link { background: none; border: 0; padding: 2px 0; color: var(--ink-2); font-weight: 600; font-size: 12px; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link:hover { color: var(--accent); text-decoration-color: currentColor; }

/* popovers */
.pop {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 60;
  width: min(360px, calc(100vw - 32px)); max-height: min(70vh, 520px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  box-shadow: var(--pop-shadow); padding: 6px;
}
.pop.right { left: auto; right: 0; width: min(260px, calc(100vw - 32px)); }
.pop-group { font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }
.pop-item {
  display: grid; gap: 1px; width: 100%; text-align: left; background: none; border: 0;
  border-radius: var(--r); padding: 8px 10px; line-height: 1.25;
}
.pop-item:hover { background: var(--surface-3); }
.pop-item[aria-current="true"] { background: var(--accent-soft); }
.pop-item b { font-weight: 650; font-size: 13px; }
.pop-item span { font-size: 12px; color: var(--muted); }
.pop-item.plain { display: block; font-size: 13px; font-weight: 550; }
.pop-item.danger { color: var(--st-crit); }
.pop-item.add { color: var(--accent); font-weight: 650; font-size: 13px; display: block; }
.pop-sep { height: 1px; background: var(--line); margin: 6px 4px; }
.pop-empty { font-size: 12px; color: var(--muted); padding: 4px 10px 8px; }
.pop-confirm { padding: 8px 10px; display: grid; gap: 8px; font-size: 13px; }
.pop-confirm div { display: flex; gap: 8px; }

/* ---------- deal head ---------- */
.head { padding-block: 22px 6px; display: grid; gap: 10px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
.eyebrow b { color: var(--accent); font-weight: 600; }
.acct {
  width: 100%; border: 1px solid transparent; border-radius: var(--r); background: transparent;
  font-size: clamp(24px, 3.4vw, 34px); font-weight: 760; font-stretch: 115%; letter-spacing: -0.02em; line-height: 1.1;
  padding: 2px 6px; margin-left: -7px; color: var(--ink);
}
.acct:hover { border-color: var(--line); }
.acct:focus { border-color: var(--line-2); background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--pos-soft); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 22px; }
.meta label { display: grid; gap: 1px; font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 0.05em; text-transform: uppercase; min-width: 0; }
.meta input {
  font-family: var(--font); text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 550;
  border: 1px solid transparent; background: transparent; border-radius: var(--r); padding: 2px 6px; margin-left: -7px;
  width: clamp(160px, 22vw, 260px); max-width: 100%;
}
.meta input:hover { border-color: var(--line); }
.meta input:focus { border-color: var(--line-2); background: var(--surface); outline: none; box-shadow: 0 0 0 3px var(--pos-soft); }
.meta input::placeholder, .acct::placeholder { color: var(--muted); opacity: 0.7; }
.banner {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; justify-content: space-between;
  background: var(--accent-soft); border-radius: var(--r-lg); padding: 10px 14px; font-size: 13px; color: var(--ink);
}
.banner.info { background: var(--surface-2); }
.banner p { min-width: 0; flex: 1 1 280px; }

/* ---------- tabs ---------- */
.tabs-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 57px)); z-index: 30; background: var(--bg); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-top: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
  padding: 11px 12px 10px; font-weight: 600; font-size: 13px; color: var(--muted);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.badge { font-family: var(--mono); font-size: 11px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 0 7px; line-height: 18px; }
.badge.warn { background: var(--warn-soft); }

.view { padding-block: 18px 56px; }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.card-h h2 { font-size: 15px; font-weight: 700; font-stretch: 108%; letter-spacing: -0.005em; }
.card-h .sub { font-size: 12px; color: var(--muted); }

/* chips (status = dot + label) */
.chip {
  display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 9px 2px 7px;
  font-size: 12px; font-weight: 600; line-height: 18px; white-space: nowrap; background: var(--surface-2); color: var(--ink);
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--neutral); flex: none; }
.chip.crit { background: var(--crit-soft); } .chip.crit i { background: var(--st-crit); }
.chip.warn { background: var(--warn-soft); } .chip.warn i { background: var(--st-warn); }
.chip.ok { background: var(--ok-soft); } .chip.ok i { background: transparent; border: 2px solid var(--st-ok); }
.chip.good { background: var(--good-soft); } .chip.good i { background: var(--st-good); }
.chip.big { font-size: 14px; padding: 4px 12px 4px 10px; }
.chip.big i { width: 10px; height: 10px; }
.chip.plain { background: transparent; padding-left: 0; }
.pchip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.mk { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.mk.ally { background: var(--pos); }
.mk.supporter { background: var(--pos-soft); box-shadow: inset 0 0 0 2px var(--pos); }
.mk.nonsupporter { background: transparent; box-shadow: inset 0 0 0 2px var(--neutral); }
.mk.opponent { background: var(--neg); }
.mk.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); }
.foxmark { width: 13px; height: 13px; flex: none; }
.foxmark path { fill: var(--accent); }

/* ---------- overview ---------- */
.ov { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.ov-col { display: grid; gap: 16px; min-width: 0; }
.fc-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hero { font-size: 60px; font-weight: 720; line-height: 1; letter-spacing: -0.03em; }
.fc-scale { font-size: 12px; color: var(--muted); }
.lede { font-size: 16px; font-weight: 550; line-height: 1.4; margin-top: 14px; max-width: 62ch; }
.note { font-size: 13px; color: var(--ink-2); margin-top: 6px; max-width: 66ch; }

.gauge { position: relative; margin-top: 18px; padding-bottom: 38px; }
.g-zones { display: flex; gap: 2px; height: 14px; }
.g-zone { height: 100%; position: relative; }
.g-zone:first-child { border-radius: 4px 0 0 4px; }
.g-zone:last-child { border-radius: 0 4px 4px 0; }
.g-zone.crit { background: var(--crit-soft); } .g-zone.warn { background: var(--warn-soft); } .g-zone.good { background: var(--good-soft); } .g-zone.ok { background: var(--ok-soft); }
.g-zone span { position: absolute; bottom: calc(100% + 4px); left: 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.g-zones-labels { height: 18px; }
.g-range { position: absolute; top: 23px; height: 4px; background: var(--pos); opacity: 0.35; border-radius: 2px; }
.g-mark { position: absolute; top: 18px; transform: translateX(-50%); }
.g-mark.now { width: 3px; height: 22px; top: 14px; background: var(--ink); border-radius: 2px; }
.g-mark.neutral, .g-mark.best { width: 12px; height: 12px; top: 19px; border-radius: 50%; border: 2px solid var(--pos); background: var(--surface); }
.g-mark.best { background: var(--pos); border-color: var(--surface); box-shadow: 0 0 0 1px var(--pos); }
.g-lab { position: absolute; transform: translateX(-50%); font-size: 12px; color: var(--ink-2); white-space: nowrap; line-height: 1.2; text-align: center; }
.g-lab b { color: var(--ink); font-weight: 700; }
.g-lab.l0 { top: 40px; } .g-lab.l1 { top: 56px; }
.g-ticks { position: absolute; left: 0; right: 0; top: 34px; font-size: 11px; color: var(--muted); font-family: var(--mono); }
.g-ticks span { position: absolute; transform: translateX(-50%); }

.drv { margin-top: 18px; border-top: 1px solid var(--line); }
.drv-row, .drv-axis { display: grid; grid-template-columns: minmax(0, 1fr) 44px minmax(0, 1.5fr); align-items: center; gap: 4px 14px; }
.drv-axis { padding: 6px 4px 0; }
.drv-row {
  width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 4px; text-align: left; border-radius: 0;
}
.drv-row:hover { background: var(--surface-3); }
.drv-name { display: grid; gap: 3px; min-width: 0; }
.drv-name b { font-weight: 650; font-size: 14px; }
.drv-name > span { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--muted); }
.drv-score { font-size: 20px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.dbar { position: relative; display: flex; height: 12px; }
.dbar .half { flex: 1 1 50%; display: flex; gap: 2px; }
.dbar .half.neg { justify-content: flex-end; padding-right: 1px; }
.dbar .half.pos { padding-left: 1px; }
.dbar .zero { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--line-2); }
.dbar i { display: block; height: 100%; flex: none; }
.dbar i.pos { background: var(--pos); border-radius: 0 4px 4px 0; }
.dbar i.gap { background: var(--neg); }
.dbar i.unk { background: var(--unk); }
.dbar .half.neg i:first-child { border-radius: 4px 0 0 4px; }
.drv-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 8px; border-radius: 2px; display: inline-block; flex: none; }
.sw.pos { background: var(--pos); } .sw.gap { background: var(--neg); } .sw.unk { background: var(--unk); }
.whisk { width: 16px; height: 10px; flex: none; }
.whisk path { stroke: var(--ink-2); stroke-width: 1.5; fill: none; opacity: 0.6; }

.acts { list-style: none; margin: 0; padding: 0; display: grid; }
.act-i { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.act-i:first-child { border-top: 0; padding-top: 2px; }
.act-n { font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 2px; }
.act-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 2px; }
.act-k.k-political { color: var(--accent); }
.act-i b { font-weight: 650; font-size: 14px; line-height: 1.35; display: block; }
.act-i p { font-size: 13px; color: var(--ink-2); margin-top: 3px; max-width: 64ch; }
.act-links { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
.act-more { margin-top: 8px; }

.mm-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }

.since-top { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: baseline; }
.since-big { font-size: 22px; font-weight: 700; }
.since-big .arr { color: var(--muted); font-weight: 500; padding-inline: 4px; }
.delta { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
.delta.up { background: var(--good-soft); color: var(--ink); }
.delta.down { background: var(--crit-soft); color: var(--ink); }
.since-secs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.since-sec { background: var(--surface-3); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.since-sec span { font-size: 12px; color: var(--muted); }
.since-sec b { font-size: 14px; font-variant-numeric: tabular-nums; }
.since-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.since-list li { display: flex; gap: 8px; align-items: baseline; }
.since-list li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); flex: none; transform: translateY(-2px); }
.since-list b { color: var(--ink); font-weight: 650; }

/* ---------- opportunity ---------- */
.opp-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
.opp-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; flex: 1 1 520px; }
.osum { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 10px 12px; text-align: left; min-width: 0; }
.osum:hover { border-color: var(--line-2); }
.osum > span { font-size: 12px; color: var(--muted); }
.osum div { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.osum b { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.secs { display: grid; gap: 16px; }
.sec-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.sec-h h3 { font-size: 18px; font-weight: 720; font-stretch: 110%; letter-spacing: -0.01em; }
.sec-h .sub { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }
.sec-score { display: flex; align-items: center; gap: 10px; }
.sec-score b { font-size: 26px; font-weight: 720; font-variant-numeric: tabular-nums; }
.crits { list-style: none; margin: 0; padding: 0; }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr) 40px; gap: 6px 16px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.crow:last-child { border-bottom: 0; padding-bottom: 2px; }
.crit-l { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; }
.crit-n { font-weight: 600; font-size: 14px; }
.tag { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--line-2); color: var(--ink-2); border-radius: 4px; padding: 0 5px; line-height: 17px; }
.qbtn { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 700; line-height: 1; padding: 0; display: inline-grid; place-items: center; }
.qbtn[aria-expanded="true"], .qbtn:hover { color: var(--ink); border-color: var(--ink-2); }
.crit-q { grid-column: 1 / -1; font-size: 13px; color: var(--ink-2); background: var(--surface-3); border-radius: var(--r); padding: 8px 12px; max-width: 90ch; }
.crit-pts { font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.crit-pts.neg { color: var(--neg); }
.crit-pts.unk { color: var(--muted); }

.seg4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: var(--surface-2); border-radius: 8px; padding: 3px; }
.seg4 button {
  display: grid; gap: 0; align-content: center; min-height: 40px; border: 0; border-radius: 6px; background: transparent;
  padding: 4px 6px; text-align: center; color: var(--ink-2); line-height: 1.2; min-width: 0;
}
.seg4 button span { font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; }
.seg4 button em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.seg4 button:hover { background: var(--surface); color: var(--ink); }
.seg4 button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(18, 29, 51, 0.12), inset 0 0 0 1.5px var(--ink); }
.seg4 button[aria-checked="true"] em { color: var(--ink); }
.seg4 button.o3 span { font-weight: 500; }
.seg4 button.o3[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--neutral); background: var(--surface-3); }
.seg4 button.o3[aria-checked="true"] span, .seg4 button.o3[aria-checked="true"] em { color: var(--ink-2); }
.seg4 button.o2[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--neg); }
.seg4 button.o0[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--pos); }

/* ---------- stakeholders ---------- */
.sh { display: grid; grid-template-columns: minmax(250px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.sh-list ul { list-style: none; padding: 0; margin: 0 -8px; display: grid; gap: 2px; }
.sh-item { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r); padding: 8px; }
.sh-item:hover { background: var(--surface-3); }
.sh-item[aria-current="true"] { background: var(--accent-soft); }
.code { font-family: var(--mono); font-weight: 600; font-size: 13px; background: var(--surface-2); border-radius: 6px; height: 34px; display: grid; place-items: center; letter-spacing: 0.02em; overflow: hidden; }
.sh-meta { display: grid; gap: 3px; min-width: 0; }
.sh-meta b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-chips { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.known { display: inline-flex; gap: 2px; align-items: center; }
.known i { width: 4px; height: 8px; border-radius: 1px; background: var(--line); }
.known i.on { background: var(--ink-2); }
.sh-list .card-h { margin-bottom: 8px; }
.sh-empty { font-size: 13px; color: var(--muted); padding: 8px 0; }

.ed-h { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.field { display: grid; gap: 4px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.field input, .field textarea, .field select {
  font-family: var(--font); text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink);
  border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 10px; width: 100%; min-width: 0;
}
.field textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--pos-soft); }
.field.code-f input { font-family: var(--mono); font-weight: 600; font-size: 16px; }
.ed-notes { margin-top: 12px; }
.ed-scores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.dimsum { background: var(--surface-3); border-radius: var(--r-lg); padding: 12px 14px; display: grid; gap: 6px; min-width: 0; }
.dimsum-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dimsum-top b { font-size: 28px; font-weight: 720; line-height: 1; font-variant-numeric: tabular-nums; }
.dimsum p { font-size: 12px; color: var(--ink-2); }
.rangebar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); margin-top: 2px; }
.rangebar .rb-span { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--pos-soft); box-shadow: inset 0 0 0 1px var(--line-2); }
.rangebar .rb-dot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--ink); border: 2px solid var(--surface-3); }
.rangebar .rb-tick { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-2); }
.rb-labels { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }

.scale-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 18px 0 4px; }
.scale-legend span { display: inline-flex; gap: 5px; align-items: baseline; }
.scale-legend b { font-family: var(--mono); font-weight: 600; color: var(--ink); }
.stmts { margin-top: 16px; }
.stmts h4 { font-size: 15px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.stmts h4 span { font-size: 12px; font-weight: 500; color: var(--muted); }
.stmts ol { list-style: none; margin: 0; padding: 0; counter-reset: st; }
.stmt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); counter-increment: st; }
.stmt-t { font-size: 13.5px; display: flex; gap: 8px; min-width: 0; }
.stmt-t::before { content: counter(st); font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 16px; padding-top: 2px; }
.seg5 { display: grid; grid-template-columns: repeat(5, 36px); gap: 3px; background: var(--surface-2); border-radius: 8px; padding: 3px; }
.seg5 button { height: 30px; border: 0; border-radius: 6px; background: transparent; font-family: var(--mono); font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 0; }
.seg5 button:hover { background: var(--surface); color: var(--ink); }
.seg5 button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--neutral); }
.seg5 button.v-2[aria-checked="true"], .seg5 button.v-1[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--neg); }
.seg5 button.v1[aria-checked="true"], .seg5 button.v2[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--pos); }
.seg5 button.v-2[aria-checked="true"] { background: var(--crit-soft); }
.seg5 button.v2[aria-checked="true"] { background: var(--pos-soft); }
.ed-empty { display: grid; place-items: center; align-content: center; text-align: center; gap: 14px; min-height: 240px; color: var(--ink-2); }
.confirm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }

/* ---------- map ---------- */
.mapv { display: grid; gap: 16px; }
.map-intro { font-size: 13.5px; color: var(--ink-2); max-width: 78ch; margin: -4px 0 14px; }
.map-intro b { color: var(--ink); font-weight: 600; }
.pg { display: grid; grid-template-columns: minmax(96px, 150px) repeat(4, minmax(0, 1fr)); gap: 4px; }
.pg-colh { display: grid; gap: 1px; align-content: end; padding: 0 10px 6px; font-size: 13px; font-weight: 650; min-width: 0; }
.pg-colh span, .pg-rowh span { display: inline-flex; align-items: center; gap: 6px; }
.pg-colh small, .pg-rowh small { font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--muted); }
.pg-rowh { display: grid; gap: 2px; align-content: center; padding: 8px 10px 8px 2px; font-size: 13px; font-weight: 650; min-width: 0; }
.pg-cell { border-radius: 8px; padding: 10px 10px 12px; min-height: 118px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pg-lab { font-size: 13px; font-weight: 700; }
.pg-cell p { font-size: 12px; color: var(--ink-2); line-height: 1.35; }
.pg-cell.empty .pg-lab, .pg-cell.empty p { opacity: 0.55; }
.pg-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pc { display: grid; gap: 1px; text-align: left; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 7px; padding: 6px 9px; min-width: 0; max-width: 100%; box-shadow: 0 1px 2px rgba(18, 29, 51, 0.06); }
.pc:hover { border-color: var(--ink-2); }
.pc.unsure { border-style: dashed; border-color: var(--ink-2); }
.pc b { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.pc-role { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px; }
.pc-sc { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.t-neg3 { background: var(--crit-soft); background: color-mix(in srgb, var(--neg) 24%, var(--surface)); }
.t-neg2 { background: var(--crit-soft); background: color-mix(in srgb, var(--neg) 14%, var(--surface)); }
.t-neg1 { background: var(--surface-3); background: color-mix(in srgb, var(--neg) 7%, var(--surface)); }
.t-pos3 { background: var(--pos-soft); background: color-mix(in srgb, var(--pos) 22%, var(--surface)); }
.t-pos2 { background: var(--pos-soft); background: color-mix(in srgb, var(--pos) 13%, var(--surface)); }
.t-pos1 { background: var(--surface-3); background: color-mix(in srgb, var(--pos) 7%, var(--surface)); }
.t-neu { background: var(--surface-3); }
.pg.compact { grid-template-columns: minmax(66px, 92px) repeat(4, minmax(0, 1fr)); gap: 3px; }
.pg.compact .pg-cell { min-height: 60px; padding: 6px 7px; gap: 2px; }
.pg.compact .pg-lab { font-size: 11px; font-weight: 650; }
.pg.compact .pg-colh { font-size: 11px; padding: 0 4px 4px; hyphens: auto; }
.pg.compact .pg-colh .mk { display: none; }
.pg.compact .pg-lab { hyphens: auto; overflow-wrap: anywhere; line-height: 1.2; }
.pg.compact .pg-rowh { font-size: 11.5px; padding-right: 4px; }
.pg.compact .pc { padding: 2px 6px; border-radius: 5px; }
.pg.compact .pc b { font-size: 11.5px; }
.pg.compact .pg-chips { gap: 4px; margin-top: 3px; }
.dash-sw { width: 18px; height: 12px; border: 1.5px dashed var(--ink-2); border-radius: 4px; display: inline-block; flex: none; }
.ovw { display: grid; gap: 16px; }
.sum-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 14px; }
.sum-grid textarea { resize: none; overflow: hidden; min-height: 0; }
.sec-desc { font-size: 13px; color: var(--ink-2); margin-top: 3px; max-width: 70ch; }
.chart { position: relative; width: 100%; min-width: 0; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font-family: var(--font); }
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tray { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.tray button { display: inline-flex; gap: 6px; align-items: center; border: 1px dashed var(--line-2); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--ink-2); }
.tray button b { font-family: var(--mono); color: var(--ink); }
.read { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.read li { display: grid; gap: 2px; font-size: 13px; color: var(--ink-2); }
.read b { color: var(--ink); font-size: 13px; }
.tbl-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl td.n, .tbl th.n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .now td { font-weight: 650; background: var(--surface-3); }
.tbl .code-cell { font-family: var(--mono); font-weight: 600; }

/* tooltip */
.tip {
  position: fixed; z-index: 80; pointer-events: none; max-width: 280px;
  background: var(--ink); color: var(--surface); border-radius: var(--r); padding: 8px 10px; font-size: 12px; line-height: 1.4;
  box-shadow: var(--pop-shadow);
}
.tip b { font-size: 13px; }
.tip .tv { font-weight: 700; }

/* ---------- history ---------- */
.hist { display: grid; gap: 16px; }
.snap-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.snap-form input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; background: var(--surface); }
.snap-form input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--pos-soft); }
.chg { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; }
.chg h4 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.chg-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.chg-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.chg-list li span { color: var(--ink-2); grid-column: 1; }
.chg-list li .delta { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.dbl { display: grid; gap: 0; }
.db-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.db-row.head { padding: 0 0 6px; font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.db-cell { display: grid; gap: 3px; min-width: 0; }
.db-cell small { font-size: 12px; color: var(--ink-2); }
.db-track { position: relative; height: 14px; }
.db-track::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px; background: var(--surface-2); border-radius: 1px; }
.db-track .z { position: absolute; left: 50%; top: 2px; height: 10px; width: 1px; background: var(--line-2); }
.db-track .ln { position: absolute; top: 6px; height: 2px; background: var(--ink-2); }
.db-track .was, .db-track .now { position: absolute; top: 1px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-50%); }
.db-track .was { border: 2px solid var(--ink-2); background: var(--surface); }
.db-track .now { background: var(--ink); border: 2px solid var(--surface); }

/* ---------- method ---------- */
.method { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.method .wide { grid-column: 1 / -1; }
.prose { font-size: 14px; color: var(--ink-2); display: grid; gap: 10px; max-width: 70ch; }
.prose b { color: var(--ink); }
.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.steps li { counter-increment: step; background: var(--surface-3); border-radius: var(--r-lg); padding: 12px 14px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.steps li::before { content: "Step " counter(step); font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
.steps b { color: var(--ink); font-size: 14px; }
.defs { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 14px; font-size: 13px; margin: 0; }
.defs dt { font-weight: 700; display: flex; align-items: center; gap: 6px; }
.defs dd { margin: 0; color: var(--ink-2); }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translate(-50%, 20px);
  background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: var(--r); font-size: 13px; font-weight: 550;
  box-shadow: var(--pop-shadow); opacity: 0; pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease; z-index: 90; max-width: calc(100vw - 32px);
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 980px) {
  .ov, .chg, .method { grid-template-columns: minmax(0, 1fr); }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .sh { grid-template-columns: minmax(0, 1fr); }
  .crow { grid-template-columns: minmax(0, 1fr) 40px; }
  .crow .seg4 { grid-column: 1 / -1; grid-row: 2; }
  .crit-pts { grid-row: 1; grid-column: 2; }
  .opp-sum { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .pg { grid-template-columns: minmax(54px, 64px) repeat(4, minmax(0, 1fr)); gap: 3px; }
  .pg-cell { min-height: 72px; padding: 6px 5px; }
  .pg-colh .mk { display: none; }
  .pg-lab { hyphens: auto; overflow-wrap: anywhere; line-height: 1.2; }
  .pg-cell p, .pc-role, .pc-sc, .pg-colh small, .pg-rowh small { display: none; }
  .pg-lab { font-size: 10.5px; }
  .pg-colh { font-size: 11px; padding: 0 3px 4px; hyphens: auto; }
  .pg-rowh { font-size: 11.5px; padding-right: 4px; }
  .pc { padding: 2px 6px; } .pc b { font-size: 11.5px; }
  .sum-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .site-link { display: none; }
  .brand b, .status span, .snap-btn span { display: none; }
  .meta { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .meta input { width: 100%; }
  .bar-inner { gap: 8px; }
  .hero { font-size: 48px; }
  .drv-row { grid-template-columns: minmax(0, 1fr) 40px; }
  .drv-row .dbar { grid-column: 1 / -1; }
  .drv-axis { grid-template-columns: minmax(0, 1fr); }
  .drv-axis > span:not(.drv-scale) { display: none; }
  .since-secs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ed-h { grid-template-columns: 90px minmax(0, 1fr); }

/* Holden Playbook — scoring engine (pure functions, no DOM). */
const Engine = (() => {
  let T = null;
  const CRIT = [];        // flat criteria list with section ref
  const CRIT_BY_ID = {};

  function setTemplate(t) {
    T = t;
    CRIT.length = 0;
    for (const s of T.sections) for (const c of s.criteria) {
      const item = Object.assign({}, c, { section: s });
      CRIT.push(item);
      CRIT_BY_ID[c.id] = item;
    }
  }

  // bands: [[max, name, tone?], ...] ascending by max
  function band(bands, score) {
    for (let i = 0; i < bands.length; i++) {
      if (score <= bands[i][0]) return { index: i, name: bands[i][1], tone: bands[i][2] || null, max: bands[i][0], min: i === 0 ? null : bands[i - 1][0] + 1 };
    }
    const i = bands.length - 1;
    return { index: i, name: bands[i][1], tone: bands[i][2] || null, max: bands[i][0], min: i === 0 ? null : bands[i - 1][0] + 1 };
  }

  function optIndex(state, c) {
    const v = state && state.opp ? state.opp[c.id] : undefined;
    return Number.isInteger(v) && v >= 0 && v <= 3 ? v : 3;
  }

  function scoreOpp(state) {
    const sections = T.sections.map((s) => {
      let score = 0, pos = 0, neg = 0, unk = 0, unknownCount = 0, best = 0, min = 0, max = 0;
      const items = s.criteria.map((c) => {
        const i = optIndex(state, c);
        const pts = c.opts[i][1];
        const top = c.opts[0][1];
        score += pts; max += top; min += c.opts[3][1];
        const unknown = i === 3;
        if (unknown) { unk += pts; unknownCount++; best += top; }
        else { if (pts > 0) pos += pts; else if (pts < 0) neg += pts; best += pts; }
        return { c: CRIT_BY_ID[c.id], i, pts, label: c.opts[i][0], unknown, swing: top - pts };
      });
      const neutral = score - unk;
      return {
        id: s.id, s, score, pos, neg, unk, unknownCount, best, neutral, min, max, items,
        band: band(s.bands, score), neutralBand: band(s.bands, neutral), bestBand: band(s.bands, best),
      };
    });
    const sum = (k) => sections.reduce((a, x) => a + x[k], 0);
    const overall = {
      score: sum('score'), pos: sum('pos'), neg: sum('neg'), unk: sum('unk'),
      unknownCount: sum('unknownCount'), best: sum('best'), neutral: sum('neutral'),
      min: sum('min'), max: sum('max'),
    };
    overall.band = band(T.overallBands, overall.score);
    overall.neutralBand = band(T.overallBands, overall.neutral);
    overall.bestBand = band(T.overallBands, overall.best);
    return { sections, overall };
  }

  function clampAnswer(v) {
    v = Math.round(Number(v));
    if (!Number.isFinite(v)) return 0;
    return Math.max(-2, Math.min(2, v));
  }

  function normAnswers(a) {
    const out = [];
    for (let i = 0; i < 10; i++) out.push(clampAnswer(a && a[i] !== undefined ? a[i] : 0));
    return out;
  }

  function scoreDim(answers, def) {
    const a = normAnswers(answers);
    let score = 0, known = 0;
    a.forEach((v) => { score += v; if (v !== 0) known++; });
    const unknown = 10 - known;
    const lo = Math.max(-20, score - 2 * unknown);
    const hi = Math.min(20, score + 2 * unknown);
    const b = band(def.bands, score);
    const next = b.index < def.bands.length - 1 ? band(def.bands, b.max + 1) : null;
    return {
      score, known, unknown, lo, hi, assessed: known > 0,
      cat: b.name, catIndex: b.index, catLo: band(def.bands, lo).name, catHi: band(def.bands, hi).name,
      toNext: next ? next.min - score : null, nextCat: next ? next.name : null,
      dontKnow: a.map((v, i) => (v === 0 ? i : -1)).filter((i) => i >= 0),
    };
  }

  function scorePerson(p) {
    const sup = scoreDim(p.support, T.support);
    const inf = scoreDim(p.influence, T.influence);
    return { p, sup, inf, placed: sup.assessed && inf.assessed };
  }

  // Influence tiers: 0 outside power base, 1 power base, 2 fox. Support tiers: 0 opponent .. 3 ally.
  const isFox = (x) => x.inf.assessed && x.inf.catIndex === 2;
  const inPowerBase = (x) => x.inf.assessed && x.inf.catIndex >= 1;

  function joinCodes(list) {
    const codes = list.map((x) => x.p.code || '?');
    if (codes.length <= 1) return codes.join('');
    return codes.slice(0, -1).join(', ') + ' and ' + codes[codes.length - 1];
  }

  function plural(n, one, many) { return n === 1 ? one : (many || one + 's'); }

  function actions(deal, state, opp) {
    const out = [];
    const people = (state.people || []).map(scorePerson);
    const comp = (deal && deal.competitor && deal.competitor.trim()) || 'the competitor';
    const assessed = people.filter((x) => x.sup.assessed || x.inf.assessed);
    const unassessed = people.filter((x) => !x.sup.assessed && !x.inf.assessed);
    const foxes = people.filter(isFox);
    const coach = foxes.find((x) => x.sup.catIndex === 3) || foxes.find((x) => x.sup.catIndex === 2) || null;

    if (people.length === 0) {
      out.push({ kind: 'assess', pri: 99, title: 'Name your stakeholders', detail: 'Add the people who shape this decision, then score their support and influence.' });
    } else if (assessed.length === 0) {
      out.push({ kind: 'assess', pri: 98, title: 'Score your stakeholders', detail: 'Nobody has been assessed yet, so the power base is invisible.', people: people.map((x) => x.p.id) });
    }

    if (assessed.length > 0 && foxes.length === 0 && people.some((x) => x.inf.assessed)) {
      out.push({ kind: 'political', pri: 95, title: 'Find the Fox', detail: 'Nobody you have assessed scores 14+ on influence. Look for who shapes decisions before they are formally made, and whose view others wait for.' });
    }

    for (const x of foxes) {
      if (x.sup.catIndex <= 1) {
        out.push({
          kind: 'political', pri: x.sup.catIndex === 0 ? 97 : 93,
          title: `Win over ${x.p.code}: a Fox who isn't with you`,
          detail: `${x.p.role ? x.p.role + '. ' : ''}Influence ${x.inf.score}, support ${x.sup.score} (${x.sup.cat}). A Fox against you usually decides the deal.`,
          people: [x.p.id],
        });
      }
    }

    for (const x of people) {
      if (!isFox(x) && inPowerBase(x) && x.sup.assessed && x.sup.catIndex === 0) {
        const via = coach && coach !== x ? ` Work through ${coach.p.code} rather than around them.` : '';
        out.push({
          kind: 'political', pri: 90,
          title: `Neutralise ${x.p.code}: an Opponent inside the power base`,
          detail: `${x.p.role ? x.p.role + '. ' : ''}Influence ${x.inf.score}, support ${x.sup.score}. Find out what they stand to lose if you win.${via}`,
          people: [x.p.id],
        });
      }
    }

    for (const x of people) {
      if (!isFox(x) && inPowerBase(x) && x.sup.catIndex === 1) {
        const close = x.sup.toNext != null && x.sup.toNext <= 3 ? Math.max(0, 4 - x.sup.toNext) : 0;
        const dk = x.sup.dontKnow.slice(0, 2).map((i) => `“${T.support.statements[i]}”`);
        let detail = `${x.p.role ? x.p.role + '. ' : ''}In the power base with support ${x.sup.score}`;
        if (x.sup.toNext != null && x.sup.toNext <= 3) detail += `, ${x.sup.toNext} ${plural(x.sup.toNext, 'point')} short of ${x.sup.nextCat}`;
        detail += '.';
        if (x.sup.unknown > 0) detail += ` ${x.sup.unknown} don't-${plural(x.sup.unknown, 'know')} to test, starting with ${dk.join(' and ')}.`;
        out.push({ kind: 'political', pri: 80 + close, title: `Convert ${x.p.code}`, detail, people: [x.p.id] });
      }
    }

    if (coach) {
      if (coach.sup.catIndex === 3) {
        out.push({ kind: 'leverage', pri: 72, title: `Use ${coach.p.code} as your coach`, detail: `A Fox (${coach.inf.score}) who is also an Ally (${coach.sup.score}). Ask for introductions into the power base and test your strategy with them before it goes formal.`, people: [coach.p.id] });
      } else {
        out.push({ kind: 'leverage', pri: 75, title: `Develop ${coach.p.code} into an Ally`, detail: `A Fox (${coach.inf.score}) who already supports you (${coach.sup.score}). ${coach.sup.toNext != null ? coach.sup.toNext + ' ' + plural(coach.sup.toNext, 'point') + ' from Ally.' : ''}`, people: [coach.p.id] });
      }
    }

    // Opportunity unknowns: competitor items grouped, our own items individually.
    const unk = [];
    for (const s of opp.sections) for (const it of s.items) if (it.unknown) unk.push(it);
    const compUnk = unk.filter((it) => it.c.comp);
    const ownUnk = unk.filter((it) => !it.c.comp);
    if (compUnk.length) {
      const swing = compUnk.reduce((a, it) => a + it.swing, 0);
      const names = compUnk.map((it) => it.c.name.replace(/^Competitor's /, '').toLowerCase());
      out.push({
        kind: 'discover', pri: 62 + 3 * compUnk.length,
        title: 'Map the competition',
        detail: `${compUnk.length} ${plural(compUnk.length, 'unknown')} about ${comp} cost ${compUnk.length * 4} pts, and could swing up to +${swing}: ${names.join(', ')}.`,
        criteria: compUnk.map((it) => it.c.id),
      });
    }
    for (const it of ownUnk) {
      out.push({
        kind: 'discover', pri: 60 + it.swing,
        title: `Find out: ${it.c.name.toLowerCase()}`,
        detail: `${it.c.q} Worth up to +${it.swing}.`,
        criteria: [it.c.id],
      });
    }

    if (unassessed.length && assessed.length) {
      out.push({ kind: 'assess', pri: 66, title: `Assess ${joinCodes(unassessed)}`, detail: `${unassessed.length} ${plural(unassessed.length, 'stakeholder')} not scored yet. Until they are, they can't appear on the power map.`, people: unassessed.map((x) => x.p.id) });
    }

    for (const s of opp.sections) for (const it of s.items) {
      if (!it.unknown && it.pts < 0) {
        out.push({ kind: 'fix', pri: 50 + 2 * Math.abs(it.pts), title: `Address ${it.c.name.toLowerCase()}: ${it.label.toLowerCase()}`, detail: `${it.c.q} Moving to “${it.c.opts[0][0]}” is worth +${it.swing}.`, criteria: [it.c.id] });
      }
    }

    for (const x of people) {
      if (!x.inf.assessed || inPowerBase(x)) continue;
      if (x.sup.catIndex >= 2) {
        out.push({ kind: 'leverage', pri: 40, title: `Keep ${x.p.code} close for intelligence`, detail: `A ${x.sup.cat.toLowerCase()} outside the power base (influence ${x.inf.score}). Useful for insight, but they can't carry the decision.`, people: [x.p.id] });
      } else if (x.sup.catIndex === 0) {
        out.push({ kind: 'political', pri: 45, title: `Watch ${x.p.code}`, detail: `Opposed (support ${x.sup.score}) but outside the power base. Keep them from recruiting someone who isn't.`, people: [x.p.id] });
      }
    }

    out.sort((a, b) => b.pri - a.pri);
    return out;
  }

  function headline(opp) {
    const o = opp.overall;
    const n = o.unknownCount;
    const unkPts = -o.unk, gapPts = -o.neg;
