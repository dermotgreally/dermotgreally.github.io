    const labs = [{ v: o.score, t: `Now <b>${num(o.score)}</b>` }];
    if (o.neutral !== o.score && o.neutral !== o.best) labs.push({ v: o.neutral, t: `Neutral <b>${num(o.neutral)}</b>` });
    if (o.best > o.score) labs.push({ v: o.best, t: `Best case <b>${num(o.best)}</b>` });
    let lastPct = -100, row = 0;
    const labHTML = labs.map((l) => {
      const p = pct(l.v);
      row = p - lastPct < 15 ? (row ? 0 : 1) : 0;
      lastPct = p;
      const shift = p < 7 ? 'translateX(-8%)' : p > 93 ? 'translateX(-92%)' : 'translateX(-50%)';
      return `<div class="g-lab l${row}" style="left:${p}%;transform:${shift}">${l.t}</div>`;
    }).join('');
    const extra = labs.length > 1 && labHTML.indexOf('l1') > -1 ? ' style="padding-bottom:54px"' : '';
    return `<div class="gauge"${extra}><div class="g-zones-labels"></div><div class="g-zones">${zones}</div>${marks.join('')}${labHTML}</div>`;
  }

  function dbarHTML(s) {
    const scale = 32;
    const w = (v) => Math.min(100, (Math.abs(v) / scale) * 100).toFixed(2);
    let neg = '', pos = '';
    if (s.unk < 0) neg += `<i class="unk" style="width:${w(s.unk)}%" data-tip="Unknowns ${num(s.unk)} (${s.unknownCount})"></i>`;
    if (s.neg < 0) neg += `<i class="gap" style="width:${w(s.neg)}%" data-tip="Known gaps ${num(s.neg)}"></i>`;
    if (s.pos > 0) pos = `<i class="pos" style="width:${w(s.pos)}%" data-tip="Strengths +${s.pos}"></i>`;
    return `<span class="dbar" aria-hidden="true"><span class="half neg">${neg}</span><span class="half pos">${pos}</span><span class="zero"></span></span>`;
  }

  function sinceHTML(d, o) {
    if (!d.snapshots.length) return '';
    const snap = d.snapshots[d.snapshots.length - 1];
    const o0 = Engine.scoreOpp(snap.state);
    const df = Engine.diff(snap.state, d.current);
    const items = [];
    const addedP = df.people.filter((x) => x.added);
    for (const x of df.people) {
      if (x.added || x.removed) continue;
      const was = x.was, now = x.now;
      if (!was.sup.assessed && now.sup.assessed) items.push({ w: 30 + Math.abs(now.sup.score), h: `<b>${esc(x.code)}</b> surfaced as ${esc(now.sup.cat.toLowerCase() === 'opponent' ? 'an Opponent' : 'a ' + now.sup.cat)}${now.inf.assessed ? ` (${esc(now.inf.cat.toLowerCase())})` : ''}` });
      else if (was.sup.assessed && now.sup.assessed && was.sup.cat !== now.sup.cat) items.push({ w: Math.abs(now.sup.score - was.sup.score), h: `<b>${esc(x.code)}</b> moved from ${esc(was.sup.cat)} to ${esc(now.sup.cat)} (${signed(now.sup.score - was.sup.score)})` });
      if (!was.inf.assessed && now.inf.assessed && now.inf.catIndex === 2) items.push({ w: 25, h: `<b>${esc(x.code)}</b> identified as a Fox` });
      else if (was.inf.assessed && now.inf.assessed && was.inf.cat !== now.inf.cat) items.push({ w: Math.abs(now.inf.score - was.inf.score), h: `<b>${esc(x.code)}</b> influence: ${esc(was.inf.cat)} → ${esc(now.inf.cat)}` });
    }
    for (const c of df.criteria) items.push({ w: Math.abs(c.delta), h: `<b>${esc(c.c.name)}</b>: ${esc(c.from)} → ${esc(c.to)} (${signed(c.delta)})` });
    if (addedP.length) items.push({ w: 3, h: `Added ${esc(addedP.map((x) => x.code).join(', '))} to the stakeholder list` });
    items.sort((a, b) => b.w - a.w);
    const secs = o.sections.map((s, i) => `<div class="since-sec"><span>${esc(s.s.short)}</span><b>${num(o0.sections[i].score)} → ${num(s.score)}</b></div>`).join('');
    return `<section class="card">
      <div class="card-h"><h2>Since ${esc(snap.label)}${snap.date ? ' · ' + esc(fmtDate(snap.date)) : ''}</h2><button class="link" data-act="tab" data-tab="history">Full history</button></div>
      <div class="since-top"><span class="since-big num">${num(o0.overall.score)}<span class="arr">→</span>${num(o.overall.score)}</span>${deltaHTML(o.overall.score - o0.overall.score)}<span class="muted" style="font-size:13px">${esc(o0.overall.band.name)} → ${esc(o.overall.band.name)}</span></div>
      <div class="since-secs">${secs}</div>
      ${items.length ? `<ul class="since-list">${items.slice(0, 6).map((x) => `<li><span>${x.h}</span></li>`).join('')}</ul>` : '<p class="muted" style="margin-top:10px;font-size:13px">No changes since this snapshot.</p>'}
    </section>`;
  }

  function viewOverview(ctx) {
    const { d, opp: o } = ctx;
    const ov = o.overall;
    const acts = Engine.actions(d, d.current, o);
    const people = d.current.people.map(Engine.scorePerson);
    const unplaced = people.filter((x) => !x.placed);
    let range = '';
    if (ov.unknownCount) {
      range = `Resolve the unknowns at the middle answer and the forecast reads ${num(ov.neutral)} (${esc(ov.neutralBand.name)}). If they all break your way, ${num(ov.best)} (${esc(ov.bestBand.name)}).`;
    }
    const rows = o.sections.map((s) => {
      const meta = [];
      if (s.unknownCount) meta.push(`${s.unknownCount} ${plural(s.unknownCount, 'unknown')} (${num(s.unk)})`);
      if (s.neg < 0) meta.push(`gaps ${num(s.neg)}`);
      if (!meta.length) meta.push('no gaps or unknowns');
      return `<button class="drv-row" data-act="goto-sec" data-sec="${s.id}" data-fk="drv-${s.id}">
        <span class="drv-name"><b>${esc(s.s.name)}</b><span>${chip(s.band)}<span>${meta.join(' · ')}</span></span></span>
        <span class="drv-score">${num(s.score)}</span>
        ${dbarHTML(s)}
      </button>`;
    }).join('');
    const shown = S.allActs ? acts : acts.slice(0, 5);
    const actHTML = shown.map((a, i) => {
      const links = [];
      (a.people || []).slice(0, 3).forEach((pid) => {
        const p = d.current.people.find((x) => x.id === pid);
        if (p) links.push(`<button class="link" data-act="goto-person" data-p="${esc(pid)}">Open ${esc(p.code || 'stakeholder')}</button>`);
      });
      if (a.criteria && a.criteria.length) links.push(`<button class="link" data-act="goto-crit" data-c="${esc(a.criteria[0])}">Go to ${a.criteria.length > 1 ? 'criteria' : 'criterion'}</button>`);
      return `<li class="act-i"><span class="act-n">${pad(i + 1)}</span><div><span class="act-k k-${a.kind}">${KIND_LABEL[a.kind] || ''}</span><b>${esc(a.title)}</b><p>${esc(a.detail)}</p>${links.length ? `<div class="act-links">${links.join('')}</div>` : ''}</div></li>`;
    }).join('');
    const summary = `<section class="card deal-sum">
        <div class="card-h"><h2>About this deal</h2><span class="sub">Frame the opportunity before you score it</span></div>
        <div class="sum-grid">
          <label class="field" for="f-objective">Sales objective<textarea id="f-objective" class="autosize" data-field="objective" rows="2" maxlength="400" placeholder="To sell [what] to [whom] by [when], so that [business result].">${esc(d.objective)}</textarea></label>
          <label class="field" for="f-description">Description<textarea id="f-description" class="autosize" data-field="description" rows="3" maxlength="2000" placeholder="What the customer is trying to fix, what’s in scope, and anything a reviewer should know.">${esc(d.description)}</textarea></label>
        </div>
      </section>`;
    return `<div class="ovw">${summary}<div class="ov">
      <div class="ov-col">
        <section class="card">
          <div class="card-h"><h2>Business forecast</h2><span class="sub">Sum of the four questions</span></div>
          <div class="fc-top"><span class="hero">${num(ov.score)}</span>${chip(ov.band, 'big')}<span class="fc-scale">on a scale of ${num(ov.min)} to ${ov.max}</span></div>
          ${gaugeHTML(ov)}
          <p class="lede">${esc(Engine.headline(o))}</p>
          ${range ? `<p class="note">${range}</p>` : ''}
          <div class="drv">${rows}<div class="drv-axis" aria-hidden="true"><span></span><span></span><span class="drv-scale"><span>${MINUS}32</span><span>0</span><span>+32</span></span></div></div>
          <div class="legend"><span><i class="sw pos"></i>Strengths</span><span><i class="sw gap"></i>Known gaps</span><span><i class="sw unk"></i>Unknowns (each ${MINUS}4)</span></div>
        </section>
        ${sinceHTML(d, o)}
      </div>
      <div class="ov-col">
        <section class="card">
          <div class="card-h"><h2>Next best actions</h2><span class="sub">Ranked by what moves the deal</span></div>
          ${acts.length ? `<ol class="acts">${actHTML}</ol>` : '<p class="muted">Nothing urgent. Protect the position.</p>'}
          ${acts.length > 5 ? `<div class="act-more"><button class="link" data-act="all-acts">${S.allActs ? 'Show fewer' : `Show all ${acts.length}`}</button></div>` : ''}
        </section>
        <section class="card">
          <div class="card-h"><h2>Power base</h2><button class="link" data-act="tab" data-tab="map">Open the map</button></div>
          ${powerGridHTML(people, { compact: true })}
          <div class="mm-foot"><span>${people.length - unplaced.length} of ${people.length} placed${people.some((x) => x.placed && unsure(x)) ? ' · dashed = mostly guesswork' : ''}</span>${unplaced.length ? `<span>Not yet assessed: ${esc(unplaced.map((x) => x.p.code || '–').join(', '))}</span>` : ''}</div>
        </section>
      </div>
    </div></div>`;
  }

  /* ---------------- opportunity ---------------- */
  function viewOpportunity(ctx) {
    const o = ctx.opp;
    const sum = o.sections.map((s) => `<button class="osum" data-act="goto-sec" data-sec="${s.id}"><span>${esc(s.s.name)}</span><div><b>${num(s.score)}</b>${chip(s.band)}</div></button>`).join('');
    const secs = o.sections.map((s) => {
      const items = s.items.map((it) => {
        const c = it.c;
        const qOpen = S.guidance || S.openQ[c.id];
        const opts = c.opts.map(([lab, pts], i) => `<button role="radio" class="o${i}" aria-checked="${it.i === i}" data-act="opp" data-c="${c.id}" data-i="${i}" data-fk="opp-${c.id}-${i}"><span>${esc(lab)}</span><em>${signed(pts)}</em></button>`).join('');
        const ptsCls = it.unknown ? 'unk' : it.pts < 0 ? 'neg' : '';
        return `<li class="crow" id="crit-${c.id}">
          <div class="crit-l"><span class="crit-n">${esc(c.name)}</span>${c.comp ? '<span class="tag">Competitor</span>' : ''}<button class="qbtn" data-act="toggle-q" data-c="${c.id}" aria-expanded="${!!qOpen}" aria-label="Guidance for ${esc(c.name)}" data-fk="q-${c.id}">?</button></div>
          <div class="seg4" role="radiogroup" aria-label="${esc(c.name)}">${opts}</div>
          <span class="crit-pts ${ptsCls}">${signed(it.pts)}</span>
          ${qOpen ? `<p class="crit-q">${esc(c.q)}</p>` : ''}
        </li>`;
      }).join('');
      return `<section class="card" id="sec-${s.id}">
        <header class="sec-h">
          <div><h3>${esc(s.s.name)}</h3>${s.s.desc ? `<p class="sec-desc">${esc(s.s.desc)}</p>` : ''}<span class="sub">Range ${num(s.min)} to ${s.max} · ${s.unknownCount} ${plural(s.unknownCount, 'unknown')}${s.unknownCount ? ` · best case ${num(s.best)}` : ''}</span></div>
          <div class="sec-score"><b>${num(s.score)}</b>${chip(s.band, 'big')}</div>
        </header>
        <ol class="crits">${items}</ol>
      </section>`;
    }).join('');
    return `<div class="opp">
      <div class="opp-tools"><div class="opp-sum">${sum}</div><label class="toggle"><input type="checkbox" data-act="toggle-guidance" ${S.guidance ? 'checked' : ''}> Show all guidance</label></div>
      <div class="secs">${secs}</div>
    </div>`;
  }

  /* ---------------- stakeholders ---------------- */
  function shListHTML(d) {
    const people = d.current.people.map(Engine.scorePerson);
    const items = people.map((x) => `<li><button class="sh-item" data-act="sel-person" data-p="${esc(x.p.id)}" aria-current="${x.p.id === S.sel}" data-fk="sh-${esc(x.p.id)}">
        <span class="code">${esc(x.p.code || '–')}</span>
        <span class="sh-meta"><b>${esc(x.p.role || 'Role not set')}</b><span class="sh-chips">${supChip(x)}${infChip(x)}</span>
        <span class="pchip" title="Answers known out of 20">${knownMeter(Math.round((x.sup.known + x.inf.known) / 2))}${x.sup.known + x.inf.known}/20 known</span></span>
      </button></li>`).join('');
    return `<div class="card-h"><h2>Stakeholders</h2><button class="btn small" data-act="add-person" data-fk="add-person">+ Add</button></div>
      ${people.length ? `<ul>${items}</ul>` : '<p class="sh-empty">No stakeholders yet. Add the people who shape this decision.</p>'}`;
  }

  function dimSummaryHTML(name, dim, def) {
    const pct = (v) => ((v + 20) / 40) * 100;
    const ticks = def.bands.slice(0, -1).map(([max]) => `<span class="rb-tick" style="left:${pct(max + 0.5)}%"></span>`).join('');
    const catHTML = dim.assessed ? `<span class="chip plain"><i class="mk ${name === 'Support' ? SUP_CLASS[dim.catIndex] : 'none'}" style="${name === 'Influence' ? 'display:none' : ''}"></i>${name === 'Influence' && dim.catIndex === 2 ? foxSvg('foxmark') : ''}${esc(dim.cat)}</span>` : '<span class="chip plain">Not assessed</span>';
    let note;
    if (!dim.assessed) note = 'Every answer is “don’t know”. Score at least one statement to place them.';
    else if (dim.unknown) note = `${dim.unknown} don’t-${plural(dim.unknown, 'know')}: could land anywhere from ${num(dim.lo)} (${esc(dim.catLo)}) to ${num(dim.hi)} (${esc(dim.catHi)}).`;
    else note = 'Every statement answered. No uncertainty left.';
    return `<div class="dimsum">
      <span class="eyebrow">${name}</span>
      <div class="dimsum-top"><b>${dim.assessed ? num(dim.score) : '–'}</b>${catHTML}</div>
      <div class="rangebar">${ticks}<span class="rb-span" style="left:${pct(dim.lo)}%;width:${pct(dim.hi) - pct(dim.lo)}%"></span>${dim.assessed ? `<span class="rb-dot" style="left:${pct(dim.score)}%"></span>` : ''}</div>
      <div class="rb-labels"><span>${MINUS}20</span><span>0</span><span>+20</span></div>
      <p>${note}</p>
    </div>`;
  }

  function stmtsHTML(p, dimKey, def) {
    const rows = def.statements.map((txt, k) => {
      const v = p[dimKey][k];
      const btns = [-2, -1, 0, 1, 2].map((val) => {
        const lab = signed(val);
        const title = T.scale.find((s) => s[0] === val)[1];
        return `<button role="radio" class="v${val}" aria-checked="${v === val}" aria-label="${esc(title)}" title="${esc(title)}" data-act="ans" data-dim="${dimKey}" data-k="${k}" data-v="${val}" data-fk="ans-${dimKey}-${k}-${val}">${lab}</button>`;
      }).join('');
      return `<li class="stmt"><span class="stmt-t">${esc(txt)}</span><div class="seg5" role="radiogroup" aria-label="${esc(txt)}">${btns}</div></li>`;
    }).join('');
    return `<section class="stmts"><h4>${esc(def.name)}<span>${esc(def.question)}</span></h4><ol>${rows}</ol></section>`;
  }

  function viewStakeholders(ctx) {
    const d = ctx.d;
    const people = d.current.people;
    if (!people.find((p) => p.id === S.sel)) S.sel = people.length ? people[0].id : null;
    const p = people.find((x) => x.id === S.sel);
    let ed;
    if (!p) {
      ed = `<div class="ed-empty"><p>Add the first person who shapes this decision.<br>Use initials if you’ll share the scorecard.</p><button class="btn" data-act="add-person">+ Add stakeholder</button></div>`;
    } else {
      const x = Engine.scorePerson(p);
      const removing = S.confirm === 'person:' + p.id;
      ed = `<div class="ed-h">
          <label class="field code-f" for="pf-code">Initials<input id="pf-code" data-pfield="code" value="${esc(p.code)}" maxlength="8" autocomplete="off"></label>
          <label class="field" for="pf-role">Role<input id="pf-role" data-pfield="role" value="${esc(p.role)}" maxlength="90" placeholder="e.g. CFO" autocomplete="off"></label>
          <div class="ed-remove">${removing
            ? `<span class="confirm-row">Remove ${esc(p.code || 'this person')}?<button class="btn small solid-danger" data-act="remove-person-yes">Remove</button><button class="btn small ghost" data-act="cancel">Keep</button></span>`
            : `<button class="btn small ghost danger" data-act="remove-person" data-fk="remove-person">Remove</button>`}</div>
        </div>
        <label class="field ed-notes" for="pf-notes">Notes and plan<textarea id="pf-notes" data-pfield="notes" rows="2" maxlength="600" placeholder="What do they need? What’s your next move with them?">${esc(p.notes)}</textarea></label>
        <div class="ed-scores">${dimSummaryHTML('Support', x.sup, T.support)}${dimSummaryHTML('Influence', x.inf, T.influence)}</div>
        <div class="scale-legend">${T.scale.map(([v, t]) => `<span><b>${signed(v)}</b>${esc(t)}</span>`).join('')}</div>
        ${stmtsHTML(p, 'support', T.support)}
        ${stmtsHTML(p, 'influence', T.influence)}`;
    }
    return `<div class="sh">
      <aside class="card sh-list" id="shList">${shListHTML(d)}</aside>
      <section class="card sh-ed">${ed}</section>
    </div>`;
  }

  /* ---------------- power map (Holden grid) ---------------- */
  // Rows: influence tier (2 Fox, 1 Power base, 0 Outside). Columns: support (0 Opponent .. 3 Ally).
  const CELLS = {
    '2-0': ['Counter now', 'A Fox against you can stop the deal on their own.', 'neg3'],
    '2-1': ['Win over', 'Influential and undecided. Your top priority.', 'neg2'],
    '2-2': ['Develop', 'Already leaning your way. Turn them into an Ally.', 'pos2'],
    '2-3': ['Use as coach', 'Let them shape the decision before it goes formal.', 'pos3'],
    '1-0': ['Neutralise', 'Find out what they stand to lose if you win.', 'neg2'],
    '1-1': ['Convert', 'Find what they personally need from the outcome.', 'neg1'],
    '1-2': ['Strengthen', 'Give them reasons and material to back you.', 'pos1'],
    '1-3': ['Arm to sell', 'Equip them to argue your case internally.', 'pos2'],
    '0-0': ['Watch', 'Stop them recruiting someone who matters.', 'neu'],
    '0-1': ['Monitor', 'Low leverage. Don’t spend time here yet.', 'neu'],
    '0-2': ['Use for intel', 'Useful insight, but they can’t carry the decision.', 'neu'],
    '0-3': ['Use for intel', 'Useful insight, but they can’t carry the decision.', 'neu'],
  };
  const cellOf = (x) => CELLS[x.inf.catIndex + '-' + x.sup.catIndex];
  const unsure = (x) => x.sup.unknown >= 4 || x.inf.unknown >= 4;

  function personTip(x) {
    const key = 'p-' + x.p.id;
    TIPS[key] = `<b>${esc(x.p.code || '–')}</b>${x.p.role ? ' · ' + esc(x.p.role) : ''}`
      + `<br>Support <span class="tv">${num(x.sup.score)}</span> ${esc(x.sup.cat)}${x.sup.unknown ? ` · could be ${num(x.sup.lo)} to ${num(x.sup.hi)}` : ''}`
      + `<br>Influence <span class="tv">${num(x.inf.score)}</span> ${esc(x.inf.cat)}${x.inf.unknown ? ` · could be ${num(x.inf.lo)} to ${num(x.inf.hi)}` : ''}`
      + `<br>${x.sup.unknown + x.inf.unknown} of 20 answers are “don’t know”`;
    return key;
  }

  function bandRange(bands, i) {
    const from = i === 0 ? -20 : bands[i - 1][0] + 1;
    return `${num(from)} to ${num(bands[i][0])}`;
  }

  function powerGridHTML(people, opts) {
    const compact = !!(opts && opts.compact);
    const placed = people.filter((x) => x.placed);
    const supB = T.support.bands, infB = T.influence.bands;
    let s = `<div class="pg${compact ? ' compact' : ''}" lang="en" role="group" aria-label="Power base map: influence by row, support by column">`;
    s += '<div class="pg-corner" aria-hidden="true"></div>';
    supB.forEach((b, c) => {
      s += `<div class="pg-colh"><span><i class="mk ${SUP_CLASS[c]}"></i>${esc(b[1])}</span>${compact ? '' : `<small>Support ${bandRange(supB, c)}</small>`}</div>`;
    });
    for (const r of [2, 1, 0]) {
      s += `<div class="pg-rowh"><span>${r === 2 ? foxSvg('foxmark') : ''}${esc(infB[r][1])}</span>${compact ? '' : `<small>Influence ${bandRange(infB, r)}</small>`}</div>`;
      for (let c = 0; c < 4; c++) {
        const [lab, txt, tone] = CELLS[r + '-' + c];
        const here = placed.filter((x) => x.inf.catIndex === r && x.sup.catIndex === c)
          .sort((a, b) => b.inf.score - a.inf.score || b.sup.score - a.sup.score);
        const chips = here.map((x) => {
          const key = personTip(x);
          const aria = `${x.p.code || 'Stakeholder'}: support ${x.sup.score}, influence ${x.inf.score}${unsure(x) ? ', position uncertain' : ''}. Open scores.`;
          return `<button class="pc${unsure(x) ? ' unsure' : ''}" data-act="goto-person" data-p="${esc(x.p.id)}" data-tip="#${esc(key)}" aria-label="${esc(aria)}"><b>${esc(x.p.code || '–')}</b>`
            + (compact ? '' : `${x.p.role ? `<span class="pc-role">${esc(x.p.role)}</span>` : ''}<span class="pc-sc">Support ${num(x.sup.score)} · Influence ${num(x.inf.score)}</span>`)
            + '</button>';
        }).join('');
        s += `<div class="pg-cell t-${tone}${here.length ? '' : ' empty'}" aria-label="${esc(infB[r][1] + ', ' + supB[c][1] + ': ' + lab)}">`
          + `<b class="pg-lab">${esc(lab)}</b>${compact ? '' : `<p>${esc(txt)}</p>`}`
          + (here.length ? `<div class="pg-chips">${chips}</div>` : '')
          + '</div>';
      }
    }
    return s + '</div>';
  }

  function viewMap(ctx) {
    const d = ctx.d;
    const people = d.current.people.map(Engine.scorePerson);
    const unplaced = people.filter((x) => !x.placed);
    const rows = people.map((x) => `<tr>
      <td class="code-cell">${esc(x.p.code || '–')}</td><td>${esc(x.p.role)}</td>
      <td class="n">${x.sup.assessed ? num(x.sup.score) : '–'}</td><td>${x.sup.assessed ? esc(x.sup.cat) : '<span class="muted">Not assessed</span>'}</td>
      <td class="n">${x.inf.assessed ? num(x.inf.score) : '–'}</td><td>${x.inf.assessed ? esc(x.inf.cat) : '<span class="muted">Not assessed</span>'}</td>
      <td>${x.placed ? esc(cellOf(x)[0]) : '<span class="muted">Not on the map</span>'}</td>
      <td class="n">${x.sup.known + x.inf.known}/20</td></tr>`).join('');
    const tray = unplaced.length
      ? `<div class="tray"><span>Not on the map yet:</span>${unplaced.map((x) => `<button data-act="goto-person" data-p="${esc(x.p.id)}"><b>${esc(x.p.code || '–')}</b>${!x.sup.assessed && !x.inf.assessed ? 'not assessed' : !x.sup.assessed ? 'support missing' : 'influence missing'}</button>`).join('')}</div>`
      : '';
    return `<div class="mapv">
      <section class="card">
        <div class="card-h"><h2>Power base map</h2></div>
        <p class="map-intro">Each person sits in a box by <b>how much influence they have over the decision</b> (rows, most at the top) and <b>how much they support you</b> (columns, strongest on the right). The box tells you what to do about them.</p>
        ${powerGridHTML(people, {})}
        <div class="map-legend"><span><i class="dash-sw"></i>Dashed outline: 4 or more “don’t know” answers, so the position is a best guess</span><span>Select a person to see or change their scores</span></div>
        ${tray}
      </section>
      <section class="card">
        <div class="card-h"><h2>Map data</h2><span class="sub">The scores behind each position</span></div>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Who</th><th>Role</th><th class="n">Support</th><th></th><th class="n">Influence</th><th></th><th>What to do</th><th class="n">Known</th></tr></thead><tbody>${rows || '<tr><td colspan="8" class="muted">No stakeholders yet.</td></tr>'}</tbody></table></div>
      </section>
    </div>`;
  }

  /* ---------------- history ---------------- */
  function trackHTML(was, now) {
    const pct = (v) => ((v + 20) / 40) * 100;
    let s = '<span class="db-track"><span class="z"></span>';
    if (was && now) {
      const a = Math.min(pct(was), pct(now)), b = Math.max(pct(was), pct(now));
      if (b > a) s += `<span class="ln" style="left:${a}%;width:${b - a}%"></span>`;
    }
    if (was != null) s += `<span class="was" style="left:${pct(was)}%"></span>`;
    if (now != null) s += `<span class="now" style="left:${pct(now)}%"></span>`;
    return s + '</span>';
  }

  function dimChange(was, now) {
    const w = was && was.assessed ? was : null, n = now && now.assessed ? now : null;
    const txt = `${w ? num(w.score) : '–'} → ${n ? num(n.score) : '–'}`;
    const cat = w && n ? (w.cat === n.cat ? n.cat : `${w.cat} → ${n.cat}`) : n ? n.cat : w ? w.cat : 'not assessed';
    return `<span class="db-cell">${trackHTML(w ? w.score : null, n ? n.score : null)}<small>${txt} · ${esc(cat)}</small></span>`;
  }

  function viewHistory(ctx) {
    const d = ctx.d;
    const rowsData = d.snapshots.map((sn) => ({ sn, o: Engine.scoreOpp(sn.state) }));
    const cell = (s) => `<td class="n"><span class="chip plain ${s.band.tone}" title="${esc(s.band.name)}"><i></i>${num(s.score)}</span></td>`;
    const rows = rowsData.map(({ sn, o }) => {
      const del = S.confirm === 'snap:' + sn.id
        ? `<span class="confirm-row"><button class="btn small solid-danger" data-act="del-snap-yes" data-id="${esc(sn.id)}">Delete</button><button class="btn small ghost" data-act="cancel">Keep</button></span>`
        : `<button class="link" data-act="del-snap" data-id="${esc(sn.id)}">Delete</button>`;
      return `<tr><td>${esc(fmtDate(sn.date) || '–')}</td><td>${esc(sn.label)}</td>${cell(o.overall)}${o.sections.map(cell).join('')}<td class="n">${o.overall.unknownCount}</td><td>${del}</td></tr>`;
    }).join('');
    const o = ctx.opp;
    const nowRow = `<tr class="now"><td>${d.updatedAt ? esc(fmtDate(d.updatedAt.slice(0, 10))) : 'Latest'}</td><td>Latest</td>${cell(o.overall)}${o.sections.map(cell).join('')}<td class="n">${o.overall.unknownCount}</td><td></td></tr>`;
    let compare = '';
    if (d.snapshots.length) {
      if (!d.snapshots.find((x) => x.id === S.compare)) S.compare = d.snapshots[d.snapshots.length - 1].id;
      const snap = d.snapshots.find((x) => x.id === S.compare);
      const df = Engine.diff(snap.state, d.current);
      const crit = df.criteria.slice().sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
      const opts = d.snapshots.map((x) => `<option value="${esc(x.id)}" ${x.id === S.compare ? 'selected' : ''}>${esc(x.label)}${x.date ? ' · ' + esc(fmtDate(x.date)) : ''}</option>`).join('');
      const pRows = df.people.map((x) => `<div class="db-row"><span class="code">${esc(x.code || '–')}</span>${dimChange(x.was && x.was.sup, x.now && x.now.sup)}${dimChange(x.was && x.was.inf, x.now && x.now.inf)}</div>`).join('');
      compare = `<section class="card">
        <div class="card-h"><h2>What changed</h2><label class="field" style="min-width:220px" for="cmp">Compare latest with<select id="cmp" data-act="compare">${opts}</select></label></div>
        <div class="chg">
          <div><h4>Opportunity answers</h4>${crit.length ? `<ul class="chg-list">${crit.map((c) => `<li><b>${esc(c.c.name)}</b><span>${esc(c.from)} → ${esc(c.to)}</span>${deltaHTML(c.delta)}</li>`).join('')}</ul>` : '<p class="muted">No answers changed.</p>'}</div>
          <div><h4>Stakeholders</h4><div class="dbl"><div class="db-row head"><span></span><span>Support (${MINUS}20 to 20)</span><span>Influence (${MINUS}20 to 20)</span></div>${pRows || '<p class="muted">No stakeholders.</p>'}</div>
            <div class="legend"><span><i class="mk" style="box-shadow:inset 0 0 0 2px var(--ink-2)"></i>Then</span><span><i class="mk" style="background:var(--ink)"></i>Now</span></div></div>
        </div>
      </section>`;
    }
    return `<div class="hist">
      <section class="card">
        <div class="card-h"><h2>Snapshots</h2><span class="sub">Freeze the scorecard before each deal review, then compare</span></div>
        <form class="snap-form" data-form="snap"><input id="snapLabel" maxlength="60" placeholder="Label, e.g. Pre-QBR review" aria-label="Snapshot label" autocomplete="off"><button class="btn" type="submit">Save snapshot</button></form>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Snapshot</th><th class="n">Forecast</th>${T.sections.map((s) => `<th class="n">${esc(s.short)}</th>`).join('')}<th class="n">Unknowns</th><th></th></tr></thead><tbody>${rows}${nowRow}</tbody></table></div>
      </section>
      ${compare || '<section class="card"><p class="muted">Save a snapshot now and again before each review. This page will then show what moved and why.</p></section>'}
    </div>`;
  }

  /* ---------------- method ---------------- */
  function bandsTable(bands, unit) {
    let lo = null;
    return `<table class="tbl"><tbody>${bands.map(([max, name, tone]) => {
      const from = lo == null ? unit[0] : lo;
      lo = max + 1;
      return `<tr><td class="n" style="width:110px">${num(from)} to ${num(Math.min(max, unit[1]))}</td><td>${tone ? chip({ name, tone }) : esc(name)}</td></tr>`;
    }).join('')}</tbody></table>`;
  }
  function viewMethod() {
    const secTables = T.sections.map((s) => {
      const min = s.criteria.reduce((a, c) => a + c.opts[3][1], 0), max = s.criteria.reduce((a, c) => a + c.opts[0][1], 0);
      return `<div><h4 style="font-size:13px;margin:12px 0 4px">${esc(s.name)} <span class="muted" style="font-weight:500">${num(min)} to ${max}</span></h4>${bandsTable(s.bands, [min, max])}</div>`;
    }).join('');
    const omin = T.sections.reduce((a, s) => a + s.criteria.reduce((b, c) => b + c.opts[3][1], 0), 0);
    const omax = T.sections.reduce((a, s) => a + s.criteria.reduce((b, c) => b + c.opts[0][1], 0), 0);
    return `<div class="method">
      <section class="card wide">
        <div class="card-h"><h2>How to run the playbook</h2><span class="sub">Every new deal starts from this template with every answer set to Unknown</span></div>
        <ol class="steps">
          <li><b>Name the stakeholders</b>Everyone who shapes the decision. Initials are fine.</li>
          <li><b>Score the opportunity</b>Answer the 25 criteria under the four questions. Revisit as the deal moves.</li>
          <li><b>Score support</b>Ten statements on how each person relates to you.</li>
          <li><b>Score influence</b>Ten statements on whether they sit in the power base, or are a Fox.</li>
          <li><b>Read the overview</b>Forecast, what drives it, and the next best actions.</li>
          <li><b>Snapshot each review</b>Freeze the scores before a deal review so you can see what moved.</li>
        </ol>
      </section>
      <section class="card">
        <div class="card-h"><h2>Opportunity scoring</h2></div>
        <div class="prose">
          <p>Each criterion has four answers. The strongest scores <b>+2 to +4</b>, the middle answer <b>0</b>, the weak answer <b>${MINUS}1 to ${MINUS}3</b>, and <b>Unknown ${MINUS}4</b>.</p>
          <p>Unknown always scores lowest, so the forecast rewards discovery. Answering an unknown can only raise the score.</p>
          <p>Competitor criteria are scored from your side: a weak competitor position is good for you.</p>
        </div>
        ${secTables}
        <div><h4 style="font-size:13px;margin:12px 0 4px">Business forecast <span class="muted" style="font-weight:500">${num(omin)} to ${omax}</span></h4>${bandsTable(T.overallBands, [omin, omax])}</div>
      </section>
      <section class="card">
        <div class="card-h"><h2>Political scoring</h2></div>
        <div class="prose">
          <p>Each statement is answered on a five-point scale: ${T.scale.map(([v, t]) => `<b>${signed(v)}</b> ${esc(t.replace(/^([A-Z])(?=[a-z'’])/, (ch) => ch.toLowerCase()))}`).join(', ')}. Ten statements give a score from ${MINUS}20 to 20.</p>
          <p>A person with every answer at “don’t know” is <b>not assessed</b> and stays off the map.</p>
        </div>
        <h4 style="font-size:13px;margin:14px 0 4px">Support</h4>${bandsTable(T.support.bands, [-20, 20])}
        <h4 style="font-size:13px;margin:14px 0 4px">Influence</h4>${bandsTable(T.influence.bands, [-20, 20])}
        <dl class="defs" style="margin-top:14px">
          <dt>${foxSvg('foxmark')}Fox</dt><dd>Influence beyond their formal authority. Shapes decisions before they are made, and usually lets others take the credit.</dd>
          <dt>Power base</dt><dd>Has real influence over this decision.</dd>
          <dt><i class="mk ally"></i>Ally</dt><dd>Actively works for you and shares privileged information.</dd>
          <dt><i class="mk opponent"></i>Opponent</dt><dd>Works against you, openly or not.</dd>
        </dl>
      </section>
      <section class="card wide">
        <div class="card-h"><h2>What the app works out for you</h2></div>
        <div class="prose" style="max-width:none">
          <p><b>Drag.</b> The overview splits every score into strengths, known gaps and unknowns, so you can tell a weak deal from one you simply don’t understand yet.</p>
          <p><b>Ranges.</b> For the forecast: where the score lands if the unknowns resolve to the middle answer, or all in your favour. For people: each don’t-know could swing a score 2 points either way, so anyone with four or more gets a dashed outline on the map.</p>
          <p><b>Next best actions.</b> Fixed rules, ranked: a Fox who isn’t with you comes first, then Opponents inside the power base, power-base members to convert, competitor unknowns, your own unknowns, people not yet assessed, and known gaps.</p>
          <p><b>Snapshots.</b> Each one freezes the full scorecard. History compares any snapshot with the latest scores.</p>
        </div>
      </section>
    </div>`;
  }

  /* ---------------- render ---------------- */
  function renderView(ctx) {
    const v = $('#view');
    let html = '';
    if (S.tab === 'overview') html = viewOverview(ctx);
    else if (S.tab === 'opportunity') html = viewOpportunity(ctx);
    else if (S.tab === 'stakeholders') html = viewStakeholders(ctx);
    else if (S.tab === 'map') html = viewMap(ctx);
    else if (S.tab === 'history') html = viewHistory(ctx);
    else html = viewMethod(ctx);
    v.innerHTML = html;
    v.setAttribute('aria-labelledby', 'tab-' + S.tab);
    drawCharts();
  }

  function autosize(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; }
  function drawCharts() {
    document.querySelectorAll('textarea.autosize').forEach(autosize);
  }

  function render() {
    const active = document.activeElement;
    const fk = active && active.getAttribute ? active.getAttribute('data-fk') || (active.id ? '#' + active.id : null) : null;
    const d = cur();
    const ctx = { d, opp: Engine.scoreOpp(d.current) };
    hideTip();
    renderBar(ctx);
    renderHead(ctx);
    renderTabs(ctx);
    renderView(ctx);
    if (fk) {
      const el = fk.charAt(0) === '#' ? document.getElementById(fk.slice(1)) : document.querySelector(`[data-fk="${CSS.escape(fk)}"]`);
      if (el && el !== document.activeElement) { try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    }
  }

  /* ---------------- actions ---------------- */
  function openDeal(id) {
    S.currentId = id;
    S.menu = null; S.confirm = null; S.sel = null; S.compare = null; S.allActs = false; S.openQ = {};
    saveUI();
    render();
    window.scrollTo({ top: 0 });
  }

  function newDeal() {
    const now = new Date().toISOString();
    const d = normDeal({ id: rid('d-'), account: '', current: { opp: {}, people: [] }, createdAt: now, updatedAt: now });
    S.deals.unshift(d);
    S.tab = 'overview';
    openDeal(d.id);
    Saver.queue(d);
    const el = $('#f-account');
    if (el) el.focus();
    toast('New deal created from the template');
  }

  function copyDeal(src, suffix) {
    const now = new Date().toISOString();
    const d = normDeal(Object.assign(clone(src), { id: rid('d-'), example: false, createdAt: now, updatedAt: now }));
    if (suffix) d.opportunity = (d.opportunity ? d.opportunity + ' ' : '') + suffix;
    S.deals.unshift(d);
    Saver.queue(d);
    openDeal(d.id);
    return d;
  }

  async function deleteDeal() {
    const d = cur();
    if (d.example) return;
    S.deals = S.deals.filter((x) => x.id !== d.id);
    Saver.dirty.delete(d.id);
    clearTimeout(Saver.timers.get(d.id));
    S.confirm = null;
    openDeal(S.deals.length ? S.deals[0].id : S.examples[0].id);
    try { await Backend.remove(d.id); toast('Deal deleted'); }
    catch (e) { toast('Couldn’t delete it from storage. Try again later.'); }
  }

  function takeSnapshot(lbl) {
    const d = cur();
    d.snapshots.push({ id: rid('s-'), label: (lbl || '').trim() || 'Snapshot', date: todayISO(), state: clone(d.current) });
    S.compare = null;
    touch(d);
    toast(d.example ? 'Snapshot taken (example, not saved)' : 'Snapshot saved · ' + fmtDate(todayISO()));
  }

  function gotoPerson(pid) {
    S.tab = 'stakeholders';
    S.sel = pid;
    S.menu = null;
    saveUI();
    render();
    const el = document.querySelector(`[data-fk="sh-${CSS.escape(pid)}"]`);
    if (el) el.focus({ preventScroll: true });
    const ed = $('.sh-ed');
    if (ed && window.innerWidth <= 860) ed.scrollIntoView({ block: 'start', behavior: 'smooth' });
    else window.scrollTo({ top: 0 });
  }

  function gotoCrit(cid, sec) {
    S.tab = 'opportunity';
    saveUI();
    render();
    const el = cid ? document.getElementById('crit-' + cid) : document.getElementById('sec-' + sec);
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 120;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  }

  /* ---------------- files ---------------- */
  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('load failed'));
      document.head.appendChild(s);
    });
  }

  async function saveFile(filename, data) {
    let dl = null;
    const inViewer = !!(window.claude && typeof window.claude.use === 'function');
    if (inViewer) { try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; } }
    if (dl) {
      try { await dl.save({ filename, data }); toast('Saved ' + filename); }
      catch (e) {
        if (e && e.code === 'declined') return;
        if (e && e.code === 'rate_limited') { toast('A save prompt is already open.'); return; }
        toast('Couldn’t save the file here.');
      }
      return;
    }
    if (inViewer) { toast('Downloads aren’t available in this view.'); return; }
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  async function exportXlsx() {
    const d = cur();
    try {
      if (!window.XLSX) { toast('Preparing Excel export…'); await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
    } catch (e) { toast('Couldn’t load the Excel exporter. Check your connection.'); return; }
    const X = window.XLSX;
    const o = Engine.scoreOpp(d.current);
    const acts = Engine.actions(d, d.current, o);
    const people = d.current.people.map(Engine.scorePerson);
    const wb = X.utils.book_new();
    const add = (name, rows, widths) => { const ws = X.utils.aoa_to_sheet(rows); if (widths) ws['!cols'] = widths.map((w) => ({ wch: w })); X.utils.book_append_sheet(wb, ws, name); };
    add('Summary', [
      ['Holden Playbook scorecard'], [],
      ['Account', d.account], ['Opportunity', d.opportunity], ['Competition', d.competitor], ['Target close', d.close], ['Sales objective', d.objective], ['Description', d.description], ['Exported', todayISO()], [],
      ['Question', 'Score', 'Band', 'Range', 'Unknowns', 'Unknowns at middle answer', 'Best case'],
      ...o.sections.map((s) => [s.s.name, s.score, s.band.name, `${s.min} to ${s.max}`, s.unknownCount, s.neutral, s.best]),
      ['Business forecast', o.overall.score, o.overall.band.name, `${o.overall.min} to ${o.overall.max}`, o.overall.unknownCount, o.overall.neutral, o.overall.best],
      [], ['Diagnosis', Engine.headline(o)], [], ['#', 'Next best action', 'Detail'],
      ...acts.map((a, i) => [i + 1, a.title, a.detail]),
    ], [28, 44, 70, 12, 10, 24, 10]);
    const oppRows = [['Question', 'Criterion', 'Competitor?', 'Answer', 'Points', 'Best possible', 'Guidance']];
    for (const s of o.sections) for (const it of s.items) oppRows.push([s.s.name, it.c.name, it.c.comp ? 'Yes' : '', it.label, it.pts, it.c.opts[0][1], it.c.q]);
    add('Opportunity', oppRows, [22, 40, 12, 22, 8, 12, 90]);
    add('Stakeholders', [
      ['Initials', 'Role', 'Support', 'Support band', 'Support known /10', 'Influence', 'Influence band', 'Influence known /10', 'Notes'],
      ...people.map((x) => [x.p.code, x.p.role, x.sup.score, x.sup.assessed ? x.sup.cat : 'Not assessed', x.sup.known, x.inf.score, x.inf.assessed ? x.inf.cat : 'Not assessed', x.inf.known, x.p.notes]),
    ], [10, 40, 9, 16, 16, 10, 20, 18, 50]);
    const matrix = (def, key) => [['Statement', ...people.map((x) => x.p.code || '–')], ...def.statements.map((st, k) => [st, ...people.map((x) => x.p[key][k])]), ['Total', ...people.map((x) => x[key === 'support' ? 'sup' : 'inf'].score)]];
    add('Support statements', matrix(T.support, 'support'), [70, ...people.map(() => 8)]);
    add('Influence statements', matrix(T.influence, 'influence'), [70, ...people.map(() => 8)]);
    if (d.snapshots.length) {
      add('History', [['Date', 'Snapshot', 'Forecast', ...T.sections.map((s) => s.short), 'Unknowns'],
        ...d.snapshots.map((sn) => { const so = Engine.scoreOpp(sn.state); return [sn.date, sn.label, so.overall.score, ...so.sections.map((s) => s.score), so.overall.unknownCount]; }),
        [todayISO(), 'Latest', o.overall.score, ...o.sections.map((s) => s.score), o.overall.unknownCount]], [12, 28, 10, 10, 10, 10, 10, 10]);
    }
    const buf = X.write(wb, { bookType: 'xlsx', type: 'array' });
    await saveFile(`${slug(label(d))} - Holden scorecard.xlsx`, buf);
  }

  async function exportJson() {
    const d = cur();
    const body = JSON.stringify({ format: 'holden-playbook', version: 1, exported: todayISO(), deal: Object.assign(clone(d), { example: false }) }, null, 2);
    await saveFile(`${slug(label(d))} - Holden deal.json`, body);
  }

  function importJson(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const obj = JSON.parse(String(fr.result));
        const raw = obj && obj.deal ? obj.deal : obj;
        if (!raw || typeof raw !== 'object' || !raw.current) throw new Error('bad');
        const d = normDeal(Object.assign({}, raw, { id: rid('d-'), example: false, updatedAt: new Date().toISOString() }));
        S.deals.unshift(d);
        Saver.queue(d);
        openDeal(d.id);
        toast('Imported ' + label(d));
      } catch (e) {
        toast('That file isn’t a Holden Playbook deal file.');
      }
    };
    fr.readAsText(file);
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (S.menu && !e.target.closest('.pop') && !(t && t.getAttribute('data-act') === 'menu')) {
      S.menu = null; if (S.confirm === 'delete-deal') S.confirm = null;
      renderBar();
      if (!t) return;
    }
    if (!t) return;
    const act = t.getAttribute('data-act');
    const d = cur();
    switch (act) {
      case 'tab': S.tab = t.getAttribute('data-tab'); S.menu = null; S.confirm = null; saveUI(); render(); window.scrollTo({ top: 0 }); break;
      case 'menu': { const m = t.getAttribute('data-menu'); S.menu = S.menu === m ? null : m; S.confirm = null; renderBar(); const first = document.querySelector('.pop [role="menuitem"]'); if (S.menu && first) first.focus(); break; }
      case 'open-deal': openDeal(t.getAttribute('data-id')); break;
      case 'new-deal': S.menu = null; newDeal(); break;
      case 'save-copy': S.menu = null; copyDeal(d, ''); toast('Saved a copy to your deals'); break;
      case 'dup-deal': S.menu = null; copyDeal(d, '(copy)'); toast('Deal duplicated'); break;
      case 'delete-deal': S.confirm = 'delete-deal'; renderBar(); break;
      case 'delete-deal-yes': S.menu = null; deleteDeal(); break;
      case 'cancel': S.confirm = null; render(); break;
      case 'snapshot': S.menu = null; takeSnapshot(''); break;
      case 'export-xlsx': S.menu = null; renderBar(); exportXlsx(); break;
      case 'export-json': S.menu = null; renderBar(); exportJson(); break;
      case 'import-json': S.menu = null; renderBar(); $('#importFile').click(); break;
      case 'move-local': {
        for (const x of S.localOnly) { if (!S.deals.find((y) => y.id === x.id)) { S.deals.push(x); Saver.queue(x); } }
        const n = S.localOnly.length; S.localOnly = []; local.set(LS_DEALS, {}); render(); toast(`Moved ${n} ${plural(n, 'deal')}`); break;
      }
      case 'opp': { const c = t.getAttribute('data-c'), i = Number(t.getAttribute('data-i')); if (d.current.opp[c] !== i) { d.current.opp[c] = i; touch(d); } break; }
      case 'ans': {
        const p = d.current.people.find((x) => x.id === S.sel); if (!p) break;
        const dim = t.getAttribute('data-dim'), k = Number(t.getAttribute('data-k')), v = Number(t.getAttribute('data-v'));
        if (p[dim][k] !== v) { p[dim][k] = v; touch(d); }
        break;
      }
      case 'toggle-q': { const c = t.getAttribute('data-c'); S.openQ[c] = !S.openQ[c]; render(); break; }
      case 'sel-person': S.sel = t.getAttribute('data-p'); S.confirm = null; render(); if (window.innerWidth <= 860) { const ed = $('.sh-ed'); if (ed) ed.scrollIntoView({ block: 'start', behavior: 'smooth' }); } break;
      case 'add-person': {
        const p = normPerson({ code: '', role: '' });
        d.current.people.push(p); S.sel = p.id; S.tab = 'stakeholders'; touch(d);
        const el = $('#pf-code'); if (el) el.focus();
        break;
      }
      case 'remove-person': S.confirm = 'person:' + S.sel; render(); break;
      case 'remove-person-yes': {
        d.current.people = d.current.people.filter((x) => x.id !== S.sel);
        S.sel = d.current.people.length ? d.current.people[0].id : null; S.confirm = null; touch(d); break;
      }
      case 'goto-person': gotoPerson(t.getAttribute('data-p')); break;
      case 'goto-crit': gotoCrit(t.getAttribute('data-c')); break;
      case 'goto-sec': gotoCrit(null, t.getAttribute('data-sec')); break;
      case 'all-acts': S.allActs = !S.allActs; render(); break;
      case 'del-snap': S.confirm = 'snap:' + t.getAttribute('data-id'); render(); break;
      case 'del-snap-yes': { const id = t.getAttribute('data-id'); d.snapshots = d.snapshots.filter((x) => x.id !== id); S.confirm = null; touch(d); toast('Snapshot deleted'); break; }
      default: break;
    }
  });

  document.addEventListener('change', (e) => {
    const t = e.target;
    const act = t.getAttribute && t.getAttribute('data-act');
    if (act === 'toggle-guidance') { S.guidance = t.checked; S.openQ = {}; saveUI(); render(); return; }
    if (act === 'toggle-unc') { S.uncertainty = t.checked; saveUI(); drawCharts(); return; }
    if (act === 'compare') { S.compare = t.value; render(); return; }
    if (t.id === 'importFile') { if (t.files && t.files[0]) importJson(t.files[0]); t.value = ''; return; }
    if (t.hasAttribute && (t.hasAttribute('data-field') || t.hasAttribute('data-pfield'))) render();
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    const d = cur();
    if (t.hasAttribute('data-field')) {
      d[t.getAttribute('data-field')] = t.value;
      if (t.classList.contains('autosize')) autosize(t);
      touch(d, { silent: true });
      renderBar();
      return;
    }
    if (t.hasAttribute('data-pfield')) {
      const p = d.current.people.find((x) => x.id === S.sel);
      if (!p) return;
      const f = t.getAttribute('data-pfield');
      p[f] = f === 'code' ? t.value.slice(0, 8) : t.value;
      touch(d, { silent: true });
      if (f !== 'notes') { const list = $('#shList'); if (list) list.innerHTML = shListHTML(d); }
    }
  });

  document.addEventListener('submit', (e) => {
    const f = e.target;
    if (f.getAttribute('data-form') === 'snap') {
      e.preventDefault();
      const inp = $('#snapLabel');
      takeSnapshot(inp ? inp.value : '');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (S.menu) { const m = S.menu; S.menu = null; S.confirm = null; renderBar(); const b = document.querySelector(`[data-fk="menu-${m}"]`); if (b) b.focus(); }
      hideTip();
    }
  });

  document.addEventListener('pointerover', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t && t !== tipFor) showTip(t, e.clientX, e.clientY);
  });
  document.addEventListener('pointermove', (e) => { if (tipFor) placeTip(e.clientX, e.clientY); });
  document.addEventListener('pointerout', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t && (!e.relatedTarget || !t.contains(e.relatedTarget))) hideTip();
  });
  document.addEventListener('focusin', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t) { const r = t.getBoundingClientRect(); showTip(t, r.left + r.width / 2, r.top + r.height / 2); }
  });
  document.addEventListener('focusout', () => hideTip());

  let resizeTimer = null;
  let lastW = window.innerWidth;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (Math.abs(window.innerWidth - lastW) > 4) { lastW = window.innerWidth; drawCharts(); } }, 120);
  });

  /* ---------------- boot ---------------- */
  async function boot() {
    const ui = local.get(LS_UI, {}) || {};
    const hash = (location.hash || '').slice(1);
    S.tab = TABS.indexOf(hash) > -1 ? hash : TABS.indexOf(ui.tab) > -1 ? ui.tab : 'overview';
    S.guidance = !!ui.guidance;
    S.uncertainty = ui.uncertainty !== false;
    render();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => drawCharts()).catch(() => {});
    let deals = [];
    try { deals = await Backend.init(); } catch (e) { deals = Backend.useLocal(); }
    const early = S.deals;
    S.deals = (deals || []).filter((x) => x && typeof x === 'object').map(normDeal).filter((x) => !x.example);
    for (const x of early) if (!S.deals.find((y) => y.id === x.id)) S.deals.push(x);
    S.deals.sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
    if (S.mode !== 'local') {
      const m = local.get(LS_DEALS, {}) || {};
      S.localOnly = Object.values(m).filter((x) => x && x.current).map(normDeal).filter((x) => !S.deals.find((y) => y.id === x.id));
    }
    if (ui.last && allDeals().find((x) => x.id === ui.last) && S.currentId === HP_EXAMPLE.id) S.currentId = ui.last;
    S.saveState = 'saved';
    render();
    Saver.flushAll();
  }
  boot();
})();

</script>
</body></html>
